
version: '3.8'

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api-local
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-users}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  user-database:
    build:
      context: .
      dockerfile: Dockerfile.user-database
    container_name: user-database
    depends_on:
      - db
    ports:
      - "${USER_DATABASE_PORT:-8082}:8082"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-users}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - PORT=8082
    volumes:
      - user_database_data:/root
      - ./.env:/root/.env
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "https://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.telegram-bot
    container_name: telegram-bot
    depends_on:
      - telegram-bot-api
      - user-database
    ports:
      - "${TELEGRAM_BOT_PORT:-8080}:8080"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - USER_DATABASE_URL=http://user-database:8082
      - PORT=8080
      - COOKIES_PATH=/root/cookies.txt
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-users}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
    volumes:
      - ./download:/root/download
      - ./cookies.txt:/root/cookies.txt
      - ./.env:/root/.env
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "https://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  telegram-bot-api-data:
  user_database_data: